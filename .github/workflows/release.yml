name: Release Tauri application

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tauri-app/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: pnpm install --frozen-lockfile

      - name: Prepare release notes
        id: release_notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $content = Get-Content -Raw CHANGELOG.md
          $pattern = "(?ms)^##\s+$([regex]::Escape($version)).*?(?=^##\s+|\z)"
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) {
            throw "No changelog section found for $version"
          }

          $notes = $match.Value.Trim()
          "body<<RELEASE_NOTES" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "RELEASE_NOTES" >> $env:GITHUB_OUTPUT

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: tauri-app
          tagName: ${{ github.ref_name }}
          releaseName: Pokémon Shiny Scanner ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
